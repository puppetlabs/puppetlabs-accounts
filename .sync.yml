---
.gitattributes:
  include:
    'files/shell/*': 'eol=lf'
".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true
.rubocop.yml:
  include_todos: true

spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
# MODULES-11699: ci.yml and nightly.yml are maintained by hand because they carry
# Puppet 9 customisations pdk-templates cannot express -- the `ruby_version` and
# `additional_packages` workflow inputs (no such keys in the templates). The
# `--collection-platform-exclude`/`--platform-exclude` flags below ARE expressible
# via the template's `acceptance_flags` key, and are listed here purely so they stay
# in sync with the hand-written `flags:` in these otherwise-unmanaged files. Leaving
# these files template-managed would let a scheduled `pdk update` silently revert
# Puppet 9 support; they can go back to full template management once pdk-templates
# gains `ruby_version` and `additional_packages` inputs.
.github/workflows/ci.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
    - '--platform-exclude scientific-7'
    - '--collection-platform-exclude 9:redhat-7'
    - '--collection-platform-exclude 9:centos-7'
    - '--collection-platform-exclude 9:centos-8'
    - '--collection-platform-exclude 9:oraclelinux-7'
    - '--collection-platform-exclude 9:debian-10'
    - '--collection-platform-exclude 9:ubuntu-18.04'
    - '--collection-platform-exclude 9:ubuntu-20.04'
.github/workflows/nightly.yml:
  unmanaged: true
  acceptance_flags:
    - '--nightly'
    - '--platform-exclude scientific-7'
    - '--collection-platform-exclude 9:redhat-7'
    - '--collection-platform-exclude 9:centos-7'
    - '--collection-platform-exclude 9:centos-8'
    - '--collection-platform-exclude 9:oraclelinux-7'
    - '--collection-platform-exclude 9:debian-10'
    - '--collection-platform-exclude 9:ubuntu-18.04'
    - '--collection-platform-exclude 9:ubuntu-20.04'
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
# MODULES-11699: pin puppetlabs_spec_helper and puppet_litmus above pdk-templates' own
# defaults (>= 8.0 and ~> 2.5 respectively), which are loose enough for a scheduled
# `pdk update` to silently revert this PR: puppetlabs_spec_helper 8.0.0 still pins
# puppet-lint ~> 4.0 (conflicts with voxpupuli-puppet-lint-plugins ~> 7.0, needed for
# Puppet 9), and puppet_litmus below 2.8.0 doesn't support --collection-platform-exclude,
# which ci.yml/nightly.yml pass unconditionally.
Gemfile:
  overrides:
    - gem: 'puppetlabs_spec_helper'
      version: '~> 9.0'
    - gem: 'puppet_litmus'
      version: '~> 2.8'
